services:
  postgres:
    image: postgres:16-alpine
    container_name: qa_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-qa_platform_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qa_admin} -d ${POSTGRES_DB:-qa_platform_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: qa_platform_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  postgres_data:
    name: qa_platform_postgres_data
  redis_data:
    name: qa_platform_redis_data

